[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenomics"
version = "1.0.0"
description = "Automated daily AI token price index (TPI) and scraper for OpenAI and Anthropic Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "epenaIFDT", email = "epena@infordata.com.pe" }
]
keywords = ["ai", "token-pricing", "llm", "openai", "anthropic", "scraper", "tokenomics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.2.0",
]

[project.scripts]
tokenomics = "token_index:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
